name: habit_tracker
description: A modern, beautiful Habit Tracking App with stunning UI/UX.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  provider: ^6.1.5+1

  # Icons
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0

  # Navigation & Routing
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.1
  http: ^1.2.0
  collection: ^1.18.0

  # Local Storage
  sqflite: ^2.3.2
  sqflite_common_ffi: ">=2.3.7 <2.4.0"
  sqlite3: ^2.9.4
  path: ^1.9.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # OAuth & Web Auth
  flutter_web_auth_2: ^5.0.2

  # UI Components
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  table_calendar: ^3.1.0
  intl: ^0.20.2
  fl_chart: ^0.68.0

  # Utils
  uuid: ^4.0.0
  url_launcher: ^6.3.0
  permission_handler: ^12.0.0+1
  image_picker: ^1.1.0
  image_cropper: ^12.2.1
  shadcn_ui: ^0.53.6
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  flutter_launcher_icons: ^0.14.3
  file_picker: ^8.1.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/meeeee.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
